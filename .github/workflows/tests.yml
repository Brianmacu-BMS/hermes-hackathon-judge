name: Plugin tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-test.txt
      - name: Run all contracts without enabling the plugin
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v

  windows-boundaries:
    # Focused native/portable controls; Bash-dependent full suites remain Linux.
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-test.txt
      - name: Native junction, URL and Git-byte regressions (not full Windows qualification)
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m unittest discover -s tests -p test_native_paths.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -m unittest discover -s tests -p test_native_paths.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_sensitive_names.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -m unittest discover -s tests -p test_sensitive_names.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_path_boundaries.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -m unittest discover -s tests -p test_path_boundaries.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_hosted_urls.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -m unittest discover -s tests -p test_hosted_urls.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_checkout_bytes.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -m unittest discover -s tests -p test_checkout_bytes.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Correctness regressions (not live backend acceptance)
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          foreach ($suite in @('test_correctness_packaging.py', 'test_correctness_analysis.py', 'test_correctness_evidence.py', 'test_correctness_release.py', 'test_local_path_admission.py', 'test_review_branch_regressions.py', 'test_review_gate_regressions.py', 'test_runtime_report_regressions.py', 'test_reconciled_report_contract.py')) {
            python -m unittest discover -s tests -p $suite -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -O -m unittest discover -s tests -p $suite -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # POSIX executable validator-fixture cases run in the Linux full suite.
          # These select portable integration/CLI cases, not a Windows backend proof.
          python -m unittest discover -s tests -p test_correctness_integration.py -k unbound_remote -k invocation_identity -k literal_trusted -k slash -k explicit_ -k standalone_ -k ignored_uninspected -k fresh_bound -k runtime_ -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -m unittest discover -s tests -p test_correctness_integration.py -k unbound_remote -k invocation_identity -k literal_trusted -k slash -k explicit_ -k standalone_ -k ignored_uninspected -k fresh_bound -k runtime_ -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
